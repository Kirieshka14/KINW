name: Build KINW IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          ls -d /Applications/Xcode*
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build KINW Target
        run: |
          xcodebuild build \
            -project KINW.xcodeproj \
            -scheme KINW \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/KINW.app Payload/
          zip -r -9 KINW.ipa Payload
          echo "IPA Size: $(ls -lh KINW.ipa | awk '{print $5}')"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KINW-iOS-Build
          path: KINW.ipa
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: KINW.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
