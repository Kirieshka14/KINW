name: KINW
options:
  bundleIdPrefix: org.kinw
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  KINW:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: KINW
        PRODUCT_BUNDLE_IDENTIFIER: org.kinw.app
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/KINW-Bridging-Header.h
        INFOPLIST_FILE: Sources/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - sdk: libz.tbd
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
